# Docker Compose for OSRM + FastAPI Application

version: '3.8'

services:
  # OSRM Car Router - provides routing services
  osrm:
    image: jostmey/osrm-car:latest
    container_name: osrm_router
    restart: unless-stopped
    volumes:
      - ./map-module:/data:ro
    environment:
      - OSM2IMGR_ARGS=-p car
    command: >
      /osrm-routed /data/ekb_graph.graphml
    ports:
      - "5000:5000"
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Application
  app:
    build: ./map-module
    container_name: fastapi_app
    restart: unless-stopped
    depends_on:
      osrm:
        condition: service_healthy
    environment:
      - USE_OSRM=true
      - OSRM_BASE_URL=http://osrm:5000
    ports:
      - "8000:8000"
    # Working directory
    working_dir: /app

