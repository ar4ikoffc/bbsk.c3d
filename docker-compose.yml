services:
  postgres:
    image: postgres:16-alpine
    container_name: bbsk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rostelecom}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rostelecom}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bbsk-network

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: bbsk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rostelecom}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-app}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - bbsk-network

volumes:
  postgres_data:
    driver: local

networks:
  bbsk-network:
    driver: bridge
